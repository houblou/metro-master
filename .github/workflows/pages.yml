name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.6,<10"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: e56771d43c944c1aaf61da442d63b61f
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          site = "https://houblou.github.io/metrology-lab-ai/"
          key = os.environ["INDEXNOW_KEY"]
          key_location = f"{site}indexnow-key.txt"

          for attempt in range(5):
              try:
                  with urllib.request.urlopen(key_location, timeout=15) as response:
                      if response.read().decode("utf-8").strip() == key:
                          break
              except Exception:
                  if attempt == 4:
                      raise
                  time.sleep(2)

          with urllib.request.urlopen(f"{site}sitemap.xml", timeout=15) as response:
              root = ET.fromstring(response.read())
          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in root.findall("s:url/s:loc", namespace) if node.text]
          payload = json.dumps({
              "host": "houblou.github.io",
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 202):
                  raise RuntimeError(f"IndexNow returned HTTP {response.status}")
              print(f"IndexNow accepted {len(urls)} URLs with HTTP {response.status}")
          PY
