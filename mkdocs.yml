site_name: MetrologyLab AI
site_description: Assistant de métrologie open source en français pour l'incertitude de mesure, ISO/IEC 17025, JCGM/GUM et les rapports auditables.
site_url: https://houblou.github.io/metrology-lab-ai/
repo_url: https://github.com/houblou/metrology-lab-ai
repo_name: houblou/metrology-lab-ai
edit_uri: edit/main/docs/
copyright: Copyright MetrologyLab AI contributors — Apache-2.0

theme:
  name: material
  language: fr
  custom_dir: docs/overrides
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy
  palette:
    primary: teal
    accent: cyan

nav:
  - Accueil: index.md
  - Architecture: architecture.md
  - Exécution vérifiable: structured-execution.md
  - Comparaison métrologique: comparison-method.md
  - Gestion des tokens: token-management.md
  - Utilisation avec ChatGPT: chatgpt-usage.md
  - Validation: validation-plan.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra:
  generator: false
