[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrology-lab-ai"
version = "0.9.6"
description = "MetrologyLab AI — orchestration métrologique et moteur de calcul vérifiable"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "MetrologyLab AI contributors"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "metrology",
  "measurement-uncertainty",
  "iso-17025",
  "jcgm",
  "calibration",
  "scientific-computing",
  "agent-skills",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: French",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://houblou.github.io/metrology-lab-ai/"
Documentation = "https://houblou.github.io/metrology-lab-ai/"
Repository = "https://github.com/houblou/metrology-lab-ai"
Issues = "https://github.com/houblou/metrology-lab-ai/issues"

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]
units = ["pint>=0.24,<1"]
verification = ["GTC>=1.5.1,<2", "uncertainties>=3.2.3,<4"]

[project.scripts]
metro-master = "metro_master.cli:main"
metrology-lab-ai = "metro_master.cli:public_main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metro_master = [
  "resources/prompts/*.md",
  "resources/*.json",
  "resources/library/*.json",
]

[tool.unittest]
start-directory = "tests"

